<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Upcoming Events</title>
<style>
body { font-family: Arial, sans-serif; margin: 40px; }
h1 { margin-bottom: 10px; }
.colab-link { 
    display: inline-block;
    margin-bottom: 20px;
    padding: 10px 15px;
    background-color: #f9ab00;
    color: white;
    text-decoration: none;
    border-radius: 4px;
    font-weight: bold;
}
.colab-link:hover { background-color: #e69500; }
input { padding: 8px; width: 300px; margin-bottom: 20px; display: block; }
.event { 
    padding: 8px;
    border-bottom: 1px solid #ddd;
}
.event:hover { background-color: #f9f9f9; }
.event-date { 
    display: inline-block;
    width: 200px;
    font-weight: bold;
}
.event-time {
    display: inline-block;
    width: 80px;
    color: #555;
}
.event-venue { 
    display: inline-block;
    width: 200px;
}
.event-city {
    display: inline-block;
    width: 150px;
    color: #555;
}
.event-band { 
    display: inline-block;
    width: 250px;
}
.event-info { 
    display: inline-block;
    color: #666;
    font-style: italic;
}
.event-source {
    display: inline-block;
    margin-left: 20px;
    padding: 4px 8px;
    background-color: #4285f4;
    color: white;
    text-decoration: none;
    border-radius: 3px;
    font-size: 12px;
}
.event-source:hover {
    background-color: #3367d6;
}
.event-source.empty {
    background-color: #ccc;
    cursor: default;
    pointer-events: none;
}
</style>
</head>
<body>
<h1>Events This Week</h1>
<a href="https://colab.research.google.com/drive/1CWl1vgV5oN6RkL2Z0wyHX0Sx_Gu4f6FA?usp=sharing" class="colab-link" target="_blank">Open in Google Colab</a>
<input type="text" id="search" placeholder="Search by date, venue, or band...">
<div id="events"></div>
<script>
async function loadEvents() {
    try {
        const response = await fetch('events.json');
        if (!response.ok) {
            throw new Error(`Failed to load events.json: ${response.status}`);
        }
        const data = await response.json();
        console.log('Loaded events:', data.length);
        console.log('Sample event:', data[0]);
        
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const nextWeek = new Date();
        nextWeek.setDate(today.getDate() + 7);
        nextWeek.setHours(23, 59, 59, 999);
        
        console.log('Filtering for dates:', today, 'to', nextWeek);
        
        const filtered = data
            .filter(e => {
                const eventDate = new Date(e.date);
                return eventDate >= today && eventDate <= nextWeek;
            })
            .sort((a, b) => {
                const dateCompare = new Date(a.date) - new Date(b.date);
                if (dateCompare !== 0) return dateCompare;
                // If dates are the same, sort by time
                const timeA = a.time || '00:00';
                const timeB = b.time || '00:00';
                return timeA.localeCompare(timeB);
            });
        
        console.log('Filtered events:', filtered.length);
        if (filtered.length > 0) {
            console.log('First filtered event:', filtered[0]);
        }
        
        return filtered;
    } catch (error) {
        console.error('Error loading events:', error);
        document.getElementById('events').innerHTML = `<div style="color: red; padding: 20px;">Error loading events: ${error.message}</div>`;
        return [];
    }
}
function formatDate(dateStr) {
    const date = new Date(dateStr);
    return date.toLocaleDateString('en-US', { 
        weekday: 'long', 
        month: 'short', 
        day: 'numeric' 
    });
}
function formatTime(timeStr) {
    if (!timeStr) return '';
    // Handle time in HH:MM format
    const [hours, minutes] = timeStr.split(':');
    const hour = parseInt(hours);
    const ampm = hour >= 12 ? 'PM' : 'AM';
    const displayHour = hour % 12 || 12;
    return `${displayHour}:${minutes} ${ampm}`;
}
function render(events) {
    const container = document.getElementById('events');
    container.innerHTML = '';
    
    console.log('Rendering', events.length, 'events');
    
    events.forEach((e, index) => {
        if (index === 0) {
            console.log('First event data:', e);
            console.log('First event location:', e.location);
        }
        
        const div = document.createElement('div');
        div.className = 'event';
        const otherInfo = e.other_info ? `<span class="event-info">${e.other_info}</span>` : '<span class="event-info">-</span>';
        const time = e.time ? `<span class="event-time">${formatTime(e.time)}</span>` : '<span class="event-time">-</span>';
        const city = e.location ? `<span class="event-city">${e.location}</span>` : '<span class="event-city">-</span>';
        const venue = e.venue || '-';
        const bandName = e.band_name || '-';
        let sourceUrl = '';
        if (e.source_url) {
            try {
                const url = new URL(e.source_url);
                const displayUrl = url.hostname.replace('www.', '') + url.pathname.substring(0, 20);
                sourceUrl = `<a href="${e.source_url}" target="_blank" class="event-source">${displayUrl}${url.pathname.length > 20 ? '...' : ''}</a>`;
            } catch {
                sourceUrl = `<a href="${e.source_url}" target="_blank" class="event-source">${e.source_url.substring(0, 30)}...</a>`;
            }
        } else {
            sourceUrl = '<span class="event-source empty">-</span>';
        }
        div.innerHTML = `
            <span class="event-date">${formatDate(e.date)}</span>
            ${time}
            <span class="event-venue">${venue}</span>
            ${city}
            <span class="event-band">${bandName}</span>
            ${otherInfo}
            ${sourceUrl}
        `;
        container.appendChild(div);
    });
    
    console.log('Render complete');
}
function applySearch(events) {
    const query = document.getElementById('search').value.toLowerCase();
    const filtered = events.filter(e => {
        const formattedDate = formatDate(e.date).toLowerCase();
        const rawDate = e.date.toLowerCase();
        const otherInfo = e.other_info ? e.other_info.toLowerCase() : '';
        const location = e.location ? e.location.toLowerCase() : '';
        return e.venue.toLowerCase().includes(query) ||
               e.band_name.toLowerCase().includes(query) ||
               formattedDate.includes(query) ||
               rawDate.includes(query) ||
               otherInfo.includes(query) ||
               location.includes(query);
    });
    render(filtered);
}
let allEvents = [];
loadEvents().then(events => {
    allEvents = events;
    render(allEvents);
    document.getElementById('search')
        .addEventListener('input', () => applySearch(allEvents));
});
</script>
</body>
</html>
