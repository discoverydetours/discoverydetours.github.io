<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Upcoming Events</title>
<style>
body { font-family: Arial, sans-serif; margin: 40px; }
h1 { margin-bottom: 10px; }
input { padding: 8px; width: 300px; margin-bottom: 20px; }

table { border-collapse: collapse; width: 100%; }
th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
th { background-color: #f2f2f2; }

tr.event:hover { background-color: #f9f9f9; }
</style>
</head>
<body>

<h1>Events This Week</h1>
<input type="text" id="search" placeholder="Search by date, venue, or band...">

<table>
<thead>
<tr>
    <th>Date</th>
    <th>Venue</th>
    <th>Band</th>
</tr>
</thead>
<tbody id="events"></tbody>
</table>

<script>
async function loadEvents() {
    const response = await fetch('events.json');
    const data = await response.json();

    const today = new Date();
    const nextWeek = new Date();
    nextWeek.setDate(today.getDate() + 7);

    const filtered = data
        .filter(e => {
            const eventDate = new Date(e.date);
            return eventDate >= today && eventDate <= nextWeek;
        })
        .sort((a, b) => new Date(a.date) - new Date(b.date));

    return filtered;
}

function render(events) {
    const tbody = document.getElementById('events');
    tbody.innerHTML = '';

    events.forEach(e => {
        const tr = document.createElement('tr');
        tr.className = 'event';
        tr.innerHTML = `
            <td>${new Date(e.date).toLocaleDateString()}</td>
            <td>${e.venue}</td>
            <td>${e.band_name}</td>
        `;
        tbody.appendChild(tr);
    });
}

function applySearch(events) {
    const query = document.getElementById('search').value.toLowerCase();

    const filtered = events.filter(e => {
        const dateStr = new Date(e.date).toLocaleDateString();
        return e.venue.toLowerCase().includes(query) ||
               e.band_name.toLowerCase().includes(query) ||
               dateStr.includes(query);
    });

    render(filtered);
}

let allEvents = [];

loadEvents().then(events => {
    allEvents = events;
    render(allEvents);

    document.getElementById('search')
        .addEventListener('input', () => applySearch(allEvents));
});
</script>

</body>
</html>
