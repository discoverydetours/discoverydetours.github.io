<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Upcoming Events</title>
<style>
body { font-family: Arial, sans-serif; margin: 40px; }
h1 { margin-bottom: 10px; }
.colab-link { 
    display: inline-block;
    margin-bottom: 20px;
    padding: 10px 15px;
    background-color: #f9ab00;
    color: white;
    text-decoration: none;
    border-radius: 4px;
    font-weight: bold;
}
.colab-link:hover { background-color: #e69500; }
input { padding: 8px; width: 300px; margin-bottom: 20px; display: block; }
.event { 
    padding: 8px;
    border-bottom: 1px solid #ddd;
}
.event:hover { background-color: #f9f9f9; }
.event-date { 
    display: inline-block;
    width: 150px;
    font-weight: bold;
}
.event-venue { 
    display: inline-block;
    width: 200px;
}
.event-band { 
    display: inline-block;
    width: 250px;
}
.event-info { 
    display: inline-block;
    color: #666;
    font-style: italic;
}
.event-source {
    display: inline-block;
    margin-left: 10px;
    padding: 4px 8px;
    background-color: #4285f4;
    color: white;
    text-decoration: none;
    border-radius: 3px;
    font-size: 12px;
}
.event-source:hover {
    background-color: #3367d6;
}
</style>
</head>
<body>
<h1>Events This Week</h1>
<a href="https://colab.research.google.com/drive/1CWl1vgV5oN6RkL2Z0wyHX0Sx_Gu4f6FA?usp=sharing" class="colab-link" target="_blank">Open in Google Colab</a>
<input type="text" id="search" placeholder="Search by date, venue, or band...">
<div id="events"></div>
<script>
async function loadEvents() {
    const response = await fetch('events.json');
    const data = await response.json();
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const nextWeek = new Date();
    nextWeek.setDate(today.getDate() + 7);
    nextWeek.setHours(23, 59, 59, 999);
    const filtered = data
        .filter(e => {
            const eventDate = new Date(e.date);
            return eventDate >= today && eventDate <= nextWeek;
        })
        .sort((a, b) => new Date(a.date) - new Date(b.date));
    return filtered;
}
function formatDate(dateStr) {
    const date = new Date(dateStr);
    return date.toLocaleDateString('en-US', { 
        weekday: 'long', 
        month: 'short', 
        day: 'numeric' 
    });
}
function render(events) {
    const container = document.getElementById('events');
    container.innerHTML = '';
    events.forEach(e => {
        const div = document.createElement('div');
        div.className = 'event';
        const otherInfo = e.other_info ? `<span class="event-info">${e.other_info}</span>` : '';
        let sourceUrl = '';
        if (e.source_url) {
            try {
                const url = new URL(e.source_url);
                const displayUrl = url.hostname.replace('www.', '') + url.pathname.substring(0, 20);
                sourceUrl = `<a href="${e.source_url}" target="_blank" class="event-source">${displayUrl}${url.pathname.length > 20 ? '...' : ''}</a>`;
            } catch {
                sourceUrl = `<a href="${e.source_url}" target="_blank" class="event-source">${e.source_url.substring(0, 30)}...</a>`;
            }
        }
        div.innerHTML = `
            <span class="event-date">${formatDate(e.date)}</span>
            <span class="event-venue">${e.venue}</span>
            <span class="event-band">${e.band_name}</span>
            ${otherInfo}
            ${sourceUrl}
        `;
        container.appendChild(div);
    });
}
function applySearch(events) {
    const query = document.getElementById('search').value.toLowerCase();
    const filtered = events.filter(e => {
        const formattedDate = formatDate(e.date).toLowerCase();
        const rawDate = e.date.toLowerCase();
        const otherInfo = e.other_info ? e.other_info.toLowerCase() : '';
        return e.venue.toLowerCase().includes(query) ||
               e.band_name.toLowerCase().includes(query) ||
               formattedDate.includes(query) ||
               rawDate.includes(query) ||
               otherInfo.includes(query);
    });
    render(filtered);
}
let allEvents = [];
loadEvents().then(events => {
    allEvents = events;
    render(allEvents);
    document.getElementById('search')
        .addEventListener('input', () => applySearch(allEvents));
});
</script>
</body>
</html>
