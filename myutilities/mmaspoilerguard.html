<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MMA Spoiler Guard</title>
    <!-- Home screen icons for iOS and Android -->
    <link rel="apple-touch-icon" href="sgicon.png" sizes="180x180">
    <link rel="icon" type="image/png" href="sgicon.png" sizes="192x192">
    <style>
        body { font-family: Arial, sans-serif; }
        .icon-container {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 10px;
        }
        .icon-container img {
            width: 72px;
            height: 72px;
        }
        h1 {
            text-align: center;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            font-size: 1.1em;
            color: #333;
            margin-bottom: 22px;
        }
        table { border-collapse: collapse; margin: 20px 0; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 6px 10px; }
        th { background: #eee; }
        tr:nth-child(even) { background: #f9f9f9; }
        button { padding: 4px 10px; }
    </style>
</head>
<body>
    <div class="icon-container">
        <img src="sgicon.png" alt="Spoiler Guard Icon">
    </div>
    <h1>MMA Spoiler Guard</h1>
    <div class="subtitle">
        Click on an event below to learn about it without spoilers
    </div>
    <table id="ufc-events">
        <thead>
            <tr>
                <th>#</th>
                <th>Event Name</th>
                <th>Date</th>
                <th>Fights</th>
            </tr>
        </thead>
        <tbody>
            <tr><td colspan="4">Loading...</td></tr>
        </tbody>
    </table>

<script>
(async function() {
    const tableBody = document.querySelector('#ufc-events tbody');
    // Fetch Wikipedia page HTML via API
    const url = 'https://en.wikipedia.org/w/api.php?action=parse&page=List_of_UFC_events&format=json&origin=*';
    const response = await fetch(url);
    const data = await response.json();
    // Parse the returned HTML
    const html = data.parse.text['*'];
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = html;
    // Find the "Past events" table by its id
    const pastEventsTable = tempDiv.querySelector('table#Past_events');
    if (!pastEventsTable) {
        tableBody.innerHTML = '<tr><td colspan="4">Could not find Past events table.</td></tr>';
        return;
    }
    const rows = pastEventsTable.querySelectorAll('tbody tr');
    tableBody.innerHTML = ''; // Clear loading message

    rows.forEach(row => {
        const cells = row.querySelectorAll('td');
        if (cells.length > 2) {
            // Number
            const eventNumber = cells[0].textContent.trim();
            // Event name and link
            const link = cells[1].querySelector('a');
            const eventName = link ? link.textContent.trim() : '';
            const eventHref = link ? link.getAttribute('href') : '';
            // Date
            const dateSpan = cells[2].querySelector('span');
            const eventDate = dateSpan ? dateSpan.textContent.trim() : cells[2].textContent.trim();

            if (eventName && eventDate) {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${eventNumber}</td>
                    <td><a href="https://en.wikipedia.org${eventHref}" target="_blank">${eventName}</a></td>
                    <td>${eventDate}</td>
                    <td>
                        <button onclick="window.open('fights.html?event=${encodeURIComponent(eventHref)}', '_blank')">
                            Fights
                        </button>
                    </td>
                `;
                tableBody.appendChild(tr);
            }
        }
    });
})();
</script>
</body>
</html>
