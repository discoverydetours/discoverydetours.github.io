<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="wicon.png" type="image/png">
  <title>Combined Weather Information</title>
  <style>
    body {
      margin: 0;
      padding: 0;
    }
    #container {
      display: flex;
      flex-direction: column;
    }
    #top-frame {
      width: 100%;
      height: 400px; /* Set very large height to avoid scrollbars */
      border: none;
      display: block;
      overflow: hidden;
    }
    #bottom-frames {
      display: flex;
      width: 100%;
    }
    #bottom-frames iframe {
      width: 50%;
      height: 1000px; /* Set very large height to avoid scrollbars */
      border: none;
      display: block;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="container">
    <iframe id="top-frame" src="https://discoverydetours.github.io/myutilities/ericweather.html" scrolling="no"></iframe>
    <div id="bottom-frames">
      <iframe src="https://discoverydetours.github.io/myutilities/cruise.html" scrolling="no"></iframe>
      <iframe src="https://discoverydetours.github.io/myutilities/aurora.html" scrolling="no"></iframe>
    </div>
  </div>
</body>
</html>
